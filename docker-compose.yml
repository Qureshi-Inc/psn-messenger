services:
  psn-messenger:
    build: .
    environment:
      - NPSSO_TOKEN=${NPSSO_TOKEN}
      - GROUP_ID=${GROUP_ID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
    ports:
      - "3001:3000"
    volumes:
      - psn_data:/data
    restart: unless-stopped

volumes:
  psn_data:
