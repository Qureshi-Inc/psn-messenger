services:
  psn-messenger:
    build: .
    environment:
      - NPSSO_TOKEN=${NPSSO_TOKEN}
      - GROUP_ID=${GROUP_ID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - WA_BRIDGE_URL=${WA_BRIDGE_URL:-}
      - WA_GOOPERS_JID=${WA_GOOPERS_JID:-}
      - CLIP_BUCKET=${CLIP_BUCKET:-}
      - CLIP_S3_ENDPOINT_URL=${CLIP_S3_ENDPOINT_URL:-}
      - GROUP_NAME=${GROUP_NAME:-crcmz-mod}
      - SQUAD_GROUP_NAME=${SQUAD_GROUP_NAME:-The Squad}
      - FFMPEG_TIMEOUT_SECONDS=${FFMPEG_TIMEOUT_SECONDS:-300}
      - MONTAGE_TIMEZONE=${MONTAGE_TIMEZONE:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    volumes:
      - psn_data:/data
    restart: unless-stopped

volumes:
  psn_data:
